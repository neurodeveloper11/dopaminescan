version: "3.8"

services:
  dopaminescan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dopaminescan-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
